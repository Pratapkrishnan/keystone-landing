<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Keystone Builders</title>
    <meta name="description" content="Get in touch with Keystone Builders for your next construction project.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css?v=5">
    <style>
        .contact-page {
            padding: 120px 4% 4rem;
            min-height: 100vh;
            background: var(--bg-dark);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .contact-placeholder {
            text-align: center;
            max-width: 600px;
        }
        .contact-placeholder h1 {
            font-family: var(--font-heading);
            font-size: clamp(2rem, 4vw, 3.5rem);
            margin-bottom: 1rem;
        }
        .contact-placeholder p {
            color: var(--text-dim);
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <main class="spatial-hero">
        <header class="header">
            <a href="./" style="text-decoration: none;">
                <div class="logo-container">
                    <svg class="logo-icon" viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
                        <path d="M50 10 L90 45 L70 45 L50 25 L30 45 L10 45 Z" fill="#C5A059"/>
                        <polygon points="50,32 65,45 35,45" fill="#C5A059"/>
                    </svg>
                    <div class="logo-text">
                        <div class="logo-title">KEYSTONE</div>
                        <div class="logo-sub">&mdash; BUILDERS &mdash;</div>
                    </div>
                </div>
            </a>
            <nav class="header-nav">
                <a href="./gallery.html" class="nav-link">GALLERY</a>
                <a href="./contact.html" class="nav-link" style="color: var(--accent);">CONTACT US</a>
            </nav>
            <a href="https://customer.keystonebuildersindia.com/" class="btn-secondary">MY PROJECT DASHBOARD</a>
        </header>
    </main>

    <section class="contact-page">
        <div class="contact-placeholder">
            <h1>COMING <span class="accent">SOON</span></h1>
            <p>We're building something exceptional here. In the meantime, reach out to us directly.</p>
            <a href="./" class="btn-primary" style="display:inline-block; text-decoration:none; transform:none;">← BACK TO HOME</a>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-links">
            <a href="#security-policy">Security</a>
            <a href="#privacy-policy">Privacy</a>
            <a href="#terms-of-service">Terms</a>
        </div>
        <div class="trust-badge">
            <span class="badge-icon">✓</span> <span class="badge-text">KEYSTONE VERIFIED</span>
        </div>
        <div class="copyright">
            &copy; 2026 KEYSTONE BUILDERS INC. ALL RIGHTS RESERVED.
        </div>
    </footer>
